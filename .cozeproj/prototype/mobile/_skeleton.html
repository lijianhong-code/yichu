<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 - 矿物绿 === */
      --color-primary:              #2F6B57;
      --color-primary-container:    #E7F0EB;
      --color-on-primary:           #ffffff;
      /* === AI 辅助色 - 暖珊瑚 === */
      --color-ai:                   #E76F51;
      --color-ai-container:         #FCECE8;
      --color-on-ai:                #A94432;
      /* === 背景 / 表面 - 中性灰调 === */
      --color-background:           #F7F8F6;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface:              #F0F2EF;
      --color-surface-container:    #ECEFEB;
      --color-surface-container-high: #E4E7E3;
      --color-surface-container-highest: #DDE2DD;
      /* === 文字 === */
      --color-on-surface:           #181C1A;
      --color-on-surface-variant:   #5D665F;
      /* === 功能色 === */
      --color-success:  #2F6B57;
      --color-error:    #B84040;
      --color-warning:  #966414;
      /* === 边框 === */
      --color-outline:          #DDE2DD;
      --color-outline-variant:  #DDE2DD;
      /* === 圆角 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.06);
      --shadow-float:  0 8px 24px rgba(0,0,0,0.10);
      --shadow-dialog: 0 20px 40px rgba(0,0,0,0.15);
      /* === 字体 === */
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    /* 自定义动画 */
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .animate-pulse-soft {
      animation: pulse-soft 2s ease-in-out infinite;
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #ECEFEB 25%, #E4E7E3 50%, #ECEFEB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start 导航组件 -->
  <!-- 顶部 Header -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <h1 class="text-base font-semibold text-on-surface">搭配</h1>
    <button class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container transition-colors">
      <i data-lucide="clock" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- 底部 TabBar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-surface border-t border-outline/20 flex justify-around items-center h-14 pb-[env(safe-area-inset-bottom)]">
    <a href="wardrobe.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant hover:text-on-surface transition-colors">
      <i data-lucide="shirt" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">衣橱</span>
    </a>
    <a href="ai-styling.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-primary" aria-current="page">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">搭配</span>
    </a>
    <a href="calendar.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant hover:text-on-surface transition-colors">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">日历</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant hover:text-on-surface transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">我的</span>
    </a>
  </nav>
  <!-- @nav:end 导航组件 -->

  <main class="overflow-y-auto pb-[calc(3.5rem+env(safe-area-inset-bottom))]">
    <!-- @main-content:start -->
    <!-- 页面内容将由子 Agent 填充 -->
    <!-- @main-content:end -->
  </main>

  <script>lucide.createIcons();</script>
</body>

</html>
